<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Birthday Surprise</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Quicksand:wght@400;600;700&display=swap');

*{box-sizing:border-box}

body{
  margin:0;
  font-family:'Quicksand',sans-serif;
  background:#fff7df;
  color:#493126;
  overflow-x:hidden;
}

button{
  border:0;
  cursor:pointer;
  font-family:inherit;
  font-weight:700;
}

.screen{
  display:none;
  min-height:100vh;
}

.screen.active{
  display:flex;
}

#opening{
  align-items:center;
  justify-content:center;
  flex-direction:column;
  text-align:center;
  padding:25px;
  background:#ffdf52;
  overflow:hidden;
  position:relative;
}

.decor{
  position:absolute;
  font-size:40px;
  animation:float 3s infinite ease-in-out;
}

.decor:nth-child(1){top:10%;left:8%}
.decor:nth-child(2){top:15%;right:10%;animation-delay:1s}
.decor:nth-child(3){bottom:12%;left:15%;animation-delay:2s}
.decor:nth-child(4){bottom:15%;right:12%;animation-delay:.5s}

@keyframes float{
  50%{transform:translateY(-20px) rotate(10deg)}
}

.title{
  font-family:'Fredoka',sans-serif;
  color:#ff5252;
  font-size:clamp(40px,8vw,80px);
  text-shadow:3px 4px white;
  transform:rotate(-3deg);
}

.cake{
  position:relative;
  width:220px;
  height:210px;
  margin:30px 0;
  animation:cakeFloat 3s infinite ease-in-out;
}

@keyframes cakeFloat{
  50%{transform:translateY(-10px)}
}

.candle{
  position:absolute;
  top:0;
  left:102px;
  width:16px;
  height:60px;
  border-radius:5px;
  background:repeating-linear-gradient(45deg,white 0 7px,#ff5252 7px 14px);
  z-index:3;
}

.flame{
  position:absolute;
  top:-30px;
  left:-2px;
  width:20px;
  height:30px;
  border-radius:50% 50% 50% 0;
  background:linear-gradient(#fff3a0,#ff9100);
  transform:rotate(-45deg);
  box-shadow:0 0 20px #ff9d00;
  animation:flicker .5s infinite alternate;
}

@keyframes flicker{
  to{transform:rotate(-45deg) scale(.85)}
}

.cake-top{
  position:absolute;
  top:60px;
  width:220px;
  height:65px;
  background:#ff8fb1;
  border:5px solid white;
  border-radius:50%;
}

.cake-top:before{
  content:'';
  position:absolute;
  inset:8px;
  border:3px dashed #ff5252;
  border-radius:50%;
}

.cake-body{
  position:absolute;
  top:85px;
  width:220px;
  height:95px;
  background:#ffb347;
  border:5px solid white;
  border-radius:15px 15px 35px 35px;
  overflow:hidden;
}

.cake-body:before{
  content:'';
  position:absolute;
  top:-10px;
  width:100%;
  height:28px;
  background:#fff5e5;
  border-radius:50%;
}

.cake-body:after{
  content:'🍓 🍒 🍓';
  position:absolute;
  top:35px;
  left:25px;
  font-size:28px;
}

.plate{
  position:absolute;
  bottom:10px;
  left:-15px;
  width:250px;
  height:25px;
  background:white;
  border:5px solid #ffb347;
  border-radius:50%;
}

.btn{
  padding:14px 25px;
  border-radius:50px;
  margin:5px;
  font-size:15px;
  transition:.2s;
}

.btn:hover{transform:translateY(-2px)}

.red{
  color:white;
  background:#ff5252;
  box-shadow:0 5px 0 #cf3636;
}

.yellow{
  color:#493126;
  background:#ffdf52;
  box-shadow:0 5px 0 #e3b82d;
}

.blue{
  color:#333;
  background:#7bdff2;
  box-shadow:0 5px 0 #42b5c8;
}

.pink{
  color:white;
  background:#ff7eb6;
  box-shadow:0 5px 0 #d65b92;
}

#celebration{
  position:fixed;
  inset:0;
  background:#ffdf52;
  display:none;
  pointer-events:none;
  z-index:10;
}

#celebration.show{display:block}

.confetti{
  position:absolute;
  top:-20px;
  animation:fall 3s linear forwards;
}

@keyframes fall{
  to{transform:translateY(110vh) rotate(720deg)}
}

.balloon{
  position:absolute;
  bottom:-100px;
  font-size:65px;
  animation:rise 6s linear forwards;
}

@keyframes rise{
  to{transform:translateY(-120vh)}
}

.shake{
  animation:shake .4s;
}

@keyframes shake{
  25%{transform:rotate(-8deg)}
  75%{transform:rotate(8deg)}
}

#maker{
  background:#fff5d9;
  align-items:center;
  justify-content:center;
  padding:30px 15px;
}

.container{
  width:100%;
  max-width:750px;
  background:white;
  border:5px solid #ff944d;
  border-radius:28px;
  padding:25px;
  box-shadow:8px 9px 0 #ffd36b;
}

.heading{
  text-align:center;
  font-family:'Fredoka',sans-serif;
  font-size:36px;
  color:#ff5252;
}

.input{
  width:100%;
  padding:14px;
  margin:8px 0;
  border:2px solid #ffd36b;
  border-radius:13px;
  font-family:inherit;
  font-size:15px;
  outline:none;
}

.input:focus{
  border-color:#ff5252;
}

textarea.input{
  min-height:150px;
  resize:vertical;
}

.filebox{
  background:#fff4c4;
  padding:15px;
  border-radius:15px;
  margin:15px 0;
  text-align:center;
}

.filebox input{
  width:100%;
  margin-top:10px;
}

.preview-photo{
  width:100%;
  max-height:450px;
  object-fit:contain;
  border-radius:15px;
  display:none;
  margin:15px 0;
}

.preview-card{
  background:#fff8e7;
  border:4px dashed #ffb347;
  border-radius:22px;
  padding:20px;
  margin-top:20px;
  text-align:center;
}

.preview-card img{
  width:100%;
  max-height:500px;
  object-fit:contain;
  border:8px solid white;
  border-radius:10px;
  margin:15px 0;
}

.preview-message{
  white-space:pre-wrap;
  overflow-wrap:anywhere;
  line-height:1.8;
  text-align:left;
  background:white;
  border-radius:15px;
  padding:20px;
}

.preview-card h2{
  font-family:'Fredoka',sans-serif;
  color:#ff5252;
  font-size:32px;
}

.preview-card h3{
  color:#d86c20;
}

.actions{
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  margin-top:20px;
  gap:8px;
}

.music{
  position:fixed;
  right:18px;
  bottom:18px;
  width:55px;
  height:55px;
  border-radius:50%;
  background:#7bdff2;
  border:3px solid white;
  box-shadow:0 4px 0 #42b5c8;
  font-size:22px;
  z-index:20;
}

.hidden{display:none!important}

@media(max-width:600px){
  .container{padding:18px}
  .heading{font-size:30px}
  .actions .btn{width:100%}
}
</style>
</head>

<body>

<!-- OPENING -->

<section id="opening" class="screen active">

  <div class="decor">🎈</div>
  <div class="decor">🎉</div>
  <div class="decor">⭐</div>
  <div class="decor">🎁</div>

  <h1 class="title">It's your birthday!</h1>
  <p>Make a wish first... ✨</p>

  <div class="cake" id="cake">
    <div class="candle">
      <div class="flame" id="flame"></div>
    </div>
    <div class="cake-top"></div>
    <div class="cake-body"></div>
    <div class="plate"></div>
  </div>

  <button class="btn red" onclick="blowCandles()">
    Blow the candles! 🕯️
  </button>

</section>

<div id="celebration"></div>

<!-- MAKER / RECEIVER -->

<section id="maker" class="screen">

  <div class="container">

    <h1 class="heading" id="pageHeading">
      Birthday Card Maker 🎂
    </h1>

    <!-- FORM -->

    <div id="formArea">

      <p style="text-align:center">
        Create a little birthday surprise! 🎀
      </p>

      <input class="input" id="receiver"
        placeholder="Nama penerima 🎂">

      <input class="input" id="sender"
        placeholder="Nama pengirim 🎁">

      <textarea class="input" id="message"
        placeholder="Tulis pesan ulang tahun di sini... ✨"></textarea>

      <div class="filebox">
        <strong>📸 Tambahkan foto</strong>
        <input type="file" id="photoInput" accept="image/*">
        <img id="photoPreview" class="preview-photo">
      </div>

      <div class="actions">
        <button class="btn yellow" onclick="previewCard()">
          Preview 👀
        </button>
      </div>

    </div>

    <!-- PREVIEW / SHARED CARD -->

    <div id="previewArea" class="hidden">

      <div class="preview-card">

        <h2>Happy Birthday! 🎂</h2>
        <h3 id="toDisplay"></h3>

        <img id="sharedPhoto" class="hidden">

        <div class="preview-message" id="messageDisplay"></div>

        <h3 id="fromDisplay"></h3>

        <div style="font-size:35px;margin:15px">
          🎈 🎁 🎉
        </div>

      </div>

      <div class="actions" id="creatorActions">

        <button class="btn red" onclick="copyLink()">
          Copy Link 🔗
        </button>

        <button class="btn blue" onclick="backToForm()">
          Edit Card ✏️
        </button>

        <button class="btn pink" onclick="makeAnother()">
          Make Another One 💌
        </button>

      </div>

      <div class="actions hidden" id="receiverActions">

        <button class="btn pink" onclick="makeAnother()">
          Make Another One 🎂
        </button>

      </div>

      <p id="copyStatus" style="text-align:center"></p>

    </div>

  </div>

</section>

<button class="music" id="musicBtn" onclick="toggleMusic()">🎵</button>

<script>

/* =========================
   MUSIC
========================= */

let audioCtx;
let musicPlaying=false;
let musicTimer;
let musicIndex=0;

const notes=[
[392,.35],[392,.35],[440,.7],[392,.7],[523.25,.7],[493.88,1.1],
[392,.35],[392,.35],[440,.7],[392,.7],[587.33,.7],[523.25,1.1],
[392,.35],[392,.35],[784,.7],[659.25,.7],[523.25,.7],[493.88,.7],[440,1.1],
[698.46,.35],[698.46,.35],[659.25,.7],[523.25,.7],[587.33,.7],[523.25,1.2]
];

function playNote(freq,duration){
  if(!audioCtx)return;

  const osc=audioCtx.createOscillator();
  const gain=audioCtx.createGain();

  osc.type="sine";
  osc.frequency.value=freq;

  gain.gain.setValueAtTime(.0001,audioCtx.currentTime);
  gain.gain.linearRampToValueAtTime(.12,audioCtx.currentTime+.04);
  gain.gain.exponentialRampToValueAtTime(.0001,audioCtx.currentTime+duration);

  osc.connect(gain);
  gain.connect(audioCtx.destination);

  osc.start();
  osc.stop(audioCtx.currentTime+duration);
}

function playNext(){
  if(!musicPlaying)return;

  let [freq,duration]=notes[musicIndex];

  playNote(freq,duration);

  musicIndex=(musicIndex+1)%notes.length;

  musicTimer=setTimeout(playNext,duration*1000+100);
}

function toggleMusic(){

  if(!audioCtx){
    audioCtx=new(window.AudioContext||window.webkitAudioContext)();
  }

  if(audioCtx.state==="suspended"){
    audioCtx.resume();
  }

  musicPlaying=!musicPlaying;

  document.getElementById("musicBtn").textContent=
    musicPlaying?"🔊":"🎵";

  if(musicPlaying){
    playNext();
  }else{
    clearTimeout(musicTimer);
  }
}

/* =========================
   CELEBRATION
========================= */

function blowCandles(){

  document.getElementById("flame").style.display="none";

  document.getElementById("cake").classList.add("shake");

  setTimeout(()=>{
    document.getElementById("cake").classList.remove("shake");
  },500);

  createConfetti();
  createBalloons();

  if(!musicPlaying)toggleMusic();

  setTimeout(()=>{
    document.getElementById("opening").classList.remove("active");
    document.getElementById("maker").classList.add("active");
    document.getElementById("celebration").classList.remove("show");
  },2200);

  document.getElementById("celebration").classList.add("show");
}

function createConfetti(){

  const area=document.getElementById("celebration");
  const colors=["#ff5252","#ffdf52","#ff944d","#ff7eb6","#7bdff2","#b28dff"];

  for(let i=0;i<140;i++){

    const piece=document.createElement("div");
    piece.className="confetti";

    piece.style.left=Math.random()*100+"%";
    piece.style.background=colors[Math.floor(Math.random()*colors.length)];
    piece.style.animationDuration=(2+Math.random()*3)+"s";
    piece.style.animationDelay=Math.random()+"s";
    piece.style.width=(6+Math.random()*10)+"px";
    piece.style.height=(8+Math.random()*14)+"px";

    area.appendChild(piece);

    setTimeout(()=>piece.remove(),6000);
  }
}

function createBalloons(){

  const area=document.getElementById("celebration");

  ["🎈","🎈","🎈","🎈","🎈"].forEach((emoji,i)=>{

    const b=document.createElement("div");
    b.className="balloon";
    b.textContent=emoji;
    b.style.left=(10+Math.random()*80)+"%";
    b.style.animationDuration=(4+Math.random()*3)+"s";
    b.style.animationDelay=i*.3+"s";

    area.appendChild(b);

    setTimeout(()=>b.remove(),8000);
  });
}

/* =========================
   PHOTO COMPRESSION
========================= */

let photoData="";

document.getElementById("photoInput").addEventListener("change",function(e){

  const file=e.target.files[0];
  if(!file)return;

  if(!file.type.startsWith("image/")){
    alert("Silakan pilih file gambar.");
    return;
  }

  const reader=new FileReader();

  reader.onload=function(event){

    const img=new Image();

    img.onload=function(){

      const canvas=document.createElement("canvas");

      const maxSize=480;
      let width=img.width;
      let height=img.height;

      if(width>maxSize||height>maxSize){

        if(width>height){
          height=Math.round(height*maxSize/width);
          width=maxSize;
        }else{
          width=Math.round(width*maxSize/height);
          height=maxSize;
        }
      }

      canvas.width=width;
      canvas.height=height;

      const ctx=canvas.getContext("2d");
      ctx.drawImage(img,0,0,width,height);

      photoData=canvas.toDataURL("image/jpeg",0.55);

      const preview=document.getElementById("photoPreview");
      preview.src=photoData;
      preview.style.display="block";
    };

    img.src=event.target.result;
  };

  reader.readAsDataURL(file);
});

/* =========================
   CARD DATA
========================= */

function getCardData(){

  return{
    receiver:document.getElementById("receiver").value.trim(),
    sender:document.getElementById("sender").value.trim(),
    message:document.getElementById("message").value.trim(),
    photo:photoData
  };
}

function renderCard(data){

  document.getElementById("toDisplay").textContent=
    "To: "+(data.receiver||"Birthday Person ♡");

  document.getElementById("messageDisplay").textContent=
    data.message||"Wishing you the happiest birthday ever! ✨";

  document.getElementById("fromDisplay").textContent=
    "From: "+(data.sender||"Someone special ♡");

  const img=document.getElementById("sharedPhoto");

  if(data.photo){

    img.src=data.photo;
    img.classList.remove("hidden");

  }else{

    img.src="";
    img.classList.add("hidden");
  }
}

/* =========================
   PREVIEW
========================= */

function previewCard(){

  renderCard(getCardData());

  document.getElementById("formArea").classList.add("hidden");
  document.getElementById("previewArea").classList.remove("hidden");
  document.getElementById("creatorActions").classList.remove("hidden");
  document.getElementById("receiverActions").classList.add("hidden");

  document.getElementById("pageHeading").textContent="Card Preview 🎀";

  window.scrollTo({top:0,behavior:"smooth"});
}

function backToForm(){

  document.getElementById("previewArea").classList.add("hidden");
  document.getElementById("formArea").classList.remove("hidden");

  document.getElementById("pageHeading").textContent="Birthday Card Maker 🎂";

  window.scrollTo({top:0,behavior:"smooth"});
}

/* =========================
   COPY SHARE LINK
========================= */

function encodeData(data){

  const bytes=new TextEncoder().encode(JSON.stringify(data));

  let binary="";

  bytes.forEach(b=>binary+=String.fromCharCode(b));

  return btoa(binary);
}

function copyLink(){

  const data=getCardData();

  const encoded=encodeData(data);

  const link=location.origin+location.pathname+"#card="+encoded;

  navigator.clipboard.writeText(link).then(()=>{

    document.getElementById("copyStatus").textContent=
      "Link berhasil disalin! Tinggal kirim ke penerima 🎉";

  }).catch(()=>{

    const input=document.createElement("textarea");
    input.value=link;
    document.body.appendChild(input);
    input.select();

    document.execCommand("copy");
    input.remove();

    document.getElementById("copyStatus").textContent=
      "Link berhasil disalin! 🎉";
  });
}

/* =========================
   MAKE ANOTHER ONE
========================= */

function makeAnother(){

  // Remove shared card data from URL
  history.replaceState(null,"",location.pathname+location.search);

  photoData="";

  document.getElementById("receiver").value="";
  document.getElementById("sender").value="";
  document.getElementById("message").value="";
  document.getElementById("photoInput").value="";
  document.getElementById("photoPreview").src="";
  document.getElementById("photoPreview").style.display="none";

  document.getElementById("previewArea").classList.add("hidden");
  document.getElementById("formArea").classList.remove("hidden");

  document.getElementById("creatorActions").classList.remove("hidden");
  document.getElementById("receiverActions").classList.add("hidden");

  document.getElementById("pageHeading").textContent="Birthday Card Maker 🎂";

  document.getElementById("copyStatus").textContent="";

  document.getElementById("opening").classList.add("active");
  document.getElementById("maker").classList.remove("active");

  document.getElementById("flame").style.display="block";

  window.scrollTo({top:0,behavior:"smooth"});
}

/* =========================
   LOAD SHARED CARD
========================= */

function loadSharedCard(){

  const hash=location.hash;

  if(!hash.startsWith("#card="))return;

  try{

    const encoded=hash.substring(6);

    const binary=atob(encoded);

    const bytes=Uint8Array.from(binary,c=>c.charCodeAt(0));

    const data=JSON.parse(new TextDecoder().decode(bytes));

    // Show card directly
    document.getElementById("opening").classList.remove("active");
    document.getElementById("maker").classList.add("active");

    document.getElementById("formArea").classList.add("hidden");
    document.getElementById("previewArea").classList.remove("hidden");

    document.getElementById("creatorActions").classList.add("hidden");
    document.getElementById("receiverActions").classList.remove("hidden");

    document.getElementById("pageHeading").textContent="A Birthday Surprise! 🎂";

    renderCard(data);

  }catch(e){

    alert("Link kartu tidak dapat dibaca.");

  }
}

loadSharedCard();

</script>
</body>
</html>
